<!DOCTYPE html>
<html>
<head>
    <title>Images, Hyperlinks and Iframe</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background: linear-gradient(to right,#74ebd5,#ACB6E5);
            margin:0;
            padding:0;
        }

        .container{
            width:80%;
            margin:30px auto;
            background:white;
            padding:20px;
            border-radius:15px;
            box-shadow:0px 0px 15px gray;
            text-align:center;
        }

        h1{
            color:#003366;
        }

        img{
            width:200px;
            height:200px;
            border-radius:15px;
            border:4px solid #0066cc;
        }

        a{
            text-decoration:none;
            color:white;
            background:#0066cc;
            padding:10px 20px;
            border-radius:5px;
            font-size:18px;
        }

        a:hover{
            background:#004080;
        }

        iframe{
            width:100%;
            height:350px;
            border:3px solid #0066cc;
            border-radius:10px;
        }
    </style>

</head>

<body>

<div class="container">

<h1>Images, Hyperlinks and Iframe</h1>

<h2>Student Image</h2>

<img src="profile.jpg" alt="Student Photo">

<br><br>

<h2>Hyperlink</h2>

<a href="https://www.google.com" target="_blank">
Visit Google
</a>

<br><br><br>

<h2>Iframe Example</h2>

<iframe src="https://www.wikipedia.org"></iframe>

</div>

</body>
</html>
