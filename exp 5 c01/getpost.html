<!DOCTYPE html>
<html>
<head>
    <title>GET and POST Methods</title>

    <style>
        body{
            font-family:Arial, sans-serif;
            background:linear-gradient(to right,#74ebd5,#9face6);
            margin:0;
            padding:20px;
        }

        .container{
            width:500px;
            margin:auto;
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        h1{
            text-align:center;
            color:darkblue;
        }

        h2{
            color:#0066cc;
        }

        label{
            font-weight:bold;
        }

        input{
            width:100%;
            padding:10px;
            margin:8px 0;
        }

        input[type=submit]{
            background:#0066cc;
            color:white;
            border:none;
            cursor:pointer;
        }

        hr{
            margin:30px 0;
        }
    </style>
</head>

<body>

<div class="container">

<h1>GET and POST Methods</h1>

<h2>GET Method Form</h2>

<form action="" method="get">

<label>Name</label>
<input type="text" name="name">

<label>Email</label>
<input type="email" name="email">

<input type="submit" value="Submit Using GET">

</form>

<hr>

<h2>POST Method Form</h2>

<form action="" method="post">

<label>Name</label>
<input type="text" name="name">

<label>Email</label>
<input type="email" name="email">

<input type="submit" value="Submit Using POST">

</form>

</div>

</body>
</html>
