<!DOCTYPE html>
<html>
<head>
<title>Student Registration Form</title>

<style>
body{
    font-family: Arial, sans-serif;
    background: linear-gradient(to right,#74ebd5,#ACB6E5);
    margin:0;
    padding:0;
}

.container{
    width:450px;
    margin:40px auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0px 0px 15px gray;
}

h1{
    text-align:center;
    color:#2c3e50;
}

label{
    font-weight:bold;
}

input,select,textarea{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:5px;
}

.gender{
    width:auto;
}

input[type=submit]{
    background:#3498db;
    color:white;
    border:none;
    cursor:pointer;
    font-size:18px;
}

input[type=submit]:hover{
    background:#2980b9;
}

input[type=reset]{
    background:#e74c3c;
    color:white;
    border:none;
    cursor:pointer;
    font-size:18px;
}

input[type=reset]:hover{
    background:#c0392b;
}
</style>

</head>

<body>

<div class="container">

<h1>Student Registration Form</h1>

<form>

<label>Full Name</label>
<input type="text" placeholder="Enter your name">

<label>Register Number</label>
<input type="text" placeholder="Enter Register Number">

<label>Email</label>
<input type="email" placeholder="Enter Email">

<label>Password</label>
<input type="password" placeholder="Enter Password">

<label>Department</label>
<select>
<option>Computer Science and Engineering</option>
<option>Information Technology</option>
<option>Electronics and Communication</option>
<option>Mechanical Engineering</option>
</select>

<label>Gender</label><br>
<input class="gender" type="radio" name="gender"> Male
<input class="gender" type="radio" name="gender"> Female

<br><br>

<label>Hobbies</label><br>
<input class="gender" type="checkbox"> Reading
<input class="gender" type="checkbox"> Music
<input class="gender" type="checkbox"> Sports

<br><br>

<label>Address</label>
<textarea rows="4" placeholder="Enter Address"></textarea>

<input type="submit" value="Register">
<input type="reset" value="Reset">

</form>

</div>

</body>
</html>
